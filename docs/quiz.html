<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — 📋 AI Agents</title>
<meta name="description" content="Self-test quiz for the 📋 AI Agents school — 10 questions with explanations.">
<meta property="og:title" content="Quiz — 📋 AI Agents"><meta property="og:description" content="10 questions with explanations. Can you pass?"><meta property="og:image" content="https://baluraut.github.io/learn-agents-school/images/big-picture-4k.png"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image">
<style>
:root { --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --blue:#2563eb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#131c2e; --ink:#e2e8f0; --muted:#94a3b8; --line:#253349; } }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; }
.wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
a { color:var(--blue); } h1 { font-size:1.9rem; }
.sub { color:var(--muted); }
.scorebox { position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5; }
.score { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 16px; font-weight:700; }
.qcard { background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent); border-radius:14px; padding:18px 20px; margin-top:16px; }
.qcard h3 { font-size:1.02rem; margin-bottom:10px; }
.opt { display:block; width:100%; text-align:left; margin-top:8px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.right { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, var(--bg)); }
.opt.wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--bg)); }
.why { display:none; margin-top:10px; color:var(--muted); font-size:.92rem; border-top:1px dashed var(--line); padding-top:8px; }
.reset { margin-top:20px; background:var(--accent); color:#fff; border:none; border-radius:10px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
footer { margin-top:44px; border-top:1px solid var(--line); padding-top:16px; color:var(--muted); font-size:.88rem; }
</style></head><body><div class="wrap">
<p><a href="index.html">← Back to the course home</a></p>
<h1>🧪 The 📋 AI Agents quiz</h1>
<p class="sub">10 questions — pick an answer, get the why. One attempt per question (until reset).
Your best score is saved in this browser.</p>
<div class="scorebox"><div class="score" id="score">0 / 10 · best: —</div></div>
<div id="quiz"></div>
<button class="reset" onclick="reset()">↺ Reset & retake</button>
<footer>Part of <a href="https://baluraut.github.io/school/">🏫 The School</a> · <a href="index.html">course home</a></footer>
</div>
<script>
var QS = [{"q": "Agent vs chatbot in one line?", "o": ["Agents are bigger models", "Outcomes via a tool loop vs answers from memory", "Agents are always safer"], "c": 1, "w": "L01: the reciter vs the doer with a hall pass."}, {"q": "The agent loop is…", "o": ["Plan, code, deploy", "Think → act → observe, repeated until done", "Input, output"], "c": 1, "w": "L02: the observation changes the next thought — that's the whole trick."}, {"q": "The model chooses tools based on…", "o": ["Alphabetical order", "Their names, descriptions and schemas — labels are half the intelligence", "Random sampling"], "c": 1, "w": "L03: if YOU can't pick from your labels, neither can the model."}, {"q": "The scratchpad is…", "o": ["A database", "Working memory in the context window — act/observe pairs the brain re-reads", "The system prompt"], "c": 1, "w": "L04: and the desk is finite — compact or externalize."}, {"q": "MAX_STEPS exists because…", "o": ["Loops are slow", "'Eventually done' is not guaranteed — runaway protection", "APIs limit it"], "c": 1, "w": "L05: a stop you designed is success, not failure."}, {"q": "Write-tools should…", "o": ["Run freely for speed", "Pause for a human gate — reads flow, writes wait", "Be removed entirely"], "c": 1, "w": "L05: the most valuable if-statement in the file."}, {"q": "Compounding errors means…", "o": ["Many small bugs", "A wrong fact at step 2 makes steps 3–9 confidently wrong", "Memory leaks"], "c": 1, "w": "L06: 95% per step ≈ 60% over ten — verify early, keep loops short."}, {"q": "Prompt injection reaches agents via…", "o": ["The system prompt", "Tool RESULTS — untrusted text landing on the desk next to the goal", "GPU drivers"], "c": 1, "w": "L06: treat observations as data; gates + logs are the antidote."}, {"q": "Evals for agents score…", "o": ["Politeness", "OUTCOMES: did the note exist, tests pass, within step budget", "Token count"], "c": 1, "w": "L06: agents without evals are demos."}, {"q": "When should you NOT build an agent?", "o": ["Never, agents always win", "When steps are known and fixed — write a script", "When the model is small"], "c": 1, "w": "L08: pattern zero — the rarest skill is declining."}];
var KEY='quiz-agents-school', answered={}, score=0;
var best = parseInt(localStorage.getItem(KEY)||'-1');
function render() {
  var el = document.getElementById('quiz'); el.innerHTML='';
  QS.forEach(function(q,i) {
    var card=document.createElement('div'); card.className='qcard';
    card.innerHTML='<h3>'+(i+1)+'. '+q.q+'</h3>';
    q.o.forEach(function(opt,j) {
      var b=document.createElement('button'); b.className='opt'; b.textContent=opt;
      b.onclick=function() {
        if (answered[i]!==undefined) return;
        answered[i]=j;
        if (j===q.c) { b.classList.add('right'); score++; }
        else { b.classList.add('wrong'); card.querySelectorAll('.opt')[q.c].classList.add('right'); }
        card.querySelector('.why').style.display='block';
        update();
      };
      card.appendChild(b);
    });
    var why=document.createElement('div'); why.className='why'; why.textContent='💡 '+q.w;
    card.appendChild(why);
    el.appendChild(card);
  });
}
function update() {
  var done=Object.keys(answered).length;
  if (done===QS.length && score>best) { best=score; localStorage.setItem(KEY,best); }
  document.getElementById('score').textContent=score+' / '+QS.length+(done===QS.length?' — done! 🎓':'')+' · best: '+(best<0?'—':best+'/'+QS.length);
}
function reset() { answered={}; score=0; render(); update(); }
render(); update();
</script></body></html>
